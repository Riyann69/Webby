<!DOCTYPE html>
<html>
<head>
<title>Employee Management (XML + AJAX)</title>
<style>
body { font-family: Arial; padding: 30px; background:#f4f6f9; }

.container { max-width: 900px; margin:auto; }

input {
    padding: 8px;
    margin: 5px 0;
    width: 100%;
}

button {
    padding: 8px 12px;
    margin: 5px 3px;
    cursor: pointer;
}

.success { color: green; }
.error { color: red; }

table {
    width:100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th { background:#e9ecef; }

</style>
</head>
<body>

<div class="container">

<h2>Employee Management System (Local XML)</h2>

<h3>Add / Update Employee</h3>
<input type="text" id="empId" placeholder="Employee ID">
<input type="text" id="empName" placeholder="Name">
<input type="text" id="empDept" placeholder="Department">
<input type="number" id="empSalary" placeholder="Salary">

<button onclick="addEmployee()">Create</button>
<button onclick="updateEmployee()">Update</button>

<div id="message"></div>

<h3>Employee Records</h3>
<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Salary</th>
<th>Action</th>
</tr>
</thead>
<tbody id="employeeTable"></tbody>
</table>

</div>

<script>

let xmlDoc = null;

function loadEmployees() {

    const xhr = new XMLHttpRequest();
    xhr.open("GET", "employees.xml", true);

    xhr.onload = function() {

        if (xhr.status === 200) {

            xmlDoc = xhr.responseXML;

            if (!xmlDoc || !xmlDoc.getElementsByTagName("employee")) {
                showMessage("Malformed XML file", "error");
                return;
            }

            renderTable();

        } else {
            showMessage("Error loading XML file (Status " + xhr.status + ")", "error");
        }
    };

    xhr.onerror = function() {
        showMessage("Network error occurred", "error");
    };

    xhr.send();
}

function renderTable() {

    const table = document.getElementById("employeeTable");
    table.innerHTML = "";

    const employees = xmlDoc.getElementsByTagName("employee");

    if (employees.length === 0) {
        showMessage("XML file is empty", "error");
        return;
    }

    for (let i = 0; i < employees.length; i++) {

        const id = employees[i].getElementsByTagName("id")[0].textContent;
        const name = employees[i].getElementsByTagName("name")[0].textContent;
        const dept = employees[i].getElementsByTagName("department")[0].textContent;
        const salary = employees[i].getElementsByTagName("salary")[0].textContent;

        table.innerHTML += `
        <tr>
            <td>${id}</td>
            <td>${name}</td>
            <td>${dept}</td>
            <td>${salary}</td>
            <td>
                <button onclick="deleteEmployee('${id}')">Delete</button>
            </td>
        </tr>
        `;
    }

    showMessage("Employees loaded successfully", "success");
}

function addEmployee() {

    const id = document.getElementById("empId").value;
    const name = document.getElementById("empName").value;
    const dept = document.getElementById("empDept").value;
    const salary = document.getElementById("empSalary").value;

    if (!xmlDoc) return;

    const employee = xmlDoc.createElement("employee");

    employee.appendChild(createNode("id", id));
    employee.appendChild(createNode("name", name));
    employee.appendChild(createNode("department", dept));
    employee.appendChild(createNode("salary", salary));

    xmlDoc.getElementsByTagName("employees")[0].appendChild(employee);

    renderTable();
    showMessage("Employee added successfully (local DOM only)", "success");
}

function updateEmployee() {

    const id = document.getElementById("empId").value;
    const dept = document.getElementById("empDept").value;
    const salary = document.getElementById("empSalary").value;

    const employees = xmlDoc.getElementsByTagName("employee");

    for (let i = 0; i < employees.length; i++) {

        if (employees[i].getElementsByTagName("id")[0].textContent === id) {

            if (dept)
                employees[i].getElementsByTagName("department")[0].textContent = dept;

            if (salary)
                employees[i].getElementsByTagName("salary")[0].textContent = salary;

            renderTable();
            showMessage("Employee updated successfully", "success");
            return;
        }
    }

    showMessage("Employee ID not found", "error");
}

function deleteEmployee(id) {

    const employees = xmlDoc.getElementsByTagName("employee");

    for (let i = 0; i < employees.length; i++) {

        if (employees[i].getElementsByTagName("id")[0].textContent === id) {

            employees[i].parentNode.removeChild(employees[i]);

            renderTable();
            showMessage("Employee deleted successfully", "success");
            return;
        }
    }

    showMessage("Employee not found", "error");
}

function createNode(tag, value) {
    const node = xmlDoc.createElement(tag);
    node.appendChild(xmlDoc.createTextNode(value));
    return node;
}

function showMessage(text, type) {
    const msg = document.getElementById("message");
    msg.textContent = text;
    msg.className = type;
}

loadEmployees();

</script>

</body>
</html>
