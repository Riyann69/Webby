<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Survey Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .survey-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .survey-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .survey-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .survey-description {
            color: #666;
            font-size: 14px;
        }

        .question-group {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f9f9f9;
            transition: all 0.3s ease;
        }

        .question-group.valid {
            border-color: #27ae60;
            background: #f0fff4;
        }

        .question-group.invalid {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        .question-label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .required-mark {
            color: #e74c3c;
            margin-left: 4px;
        }

        .question-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }

        .text-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .text-input.invalid {
            border-color: #e74c3c;
            background-color: #fff5f5;
        }

        .text-input.valid {
            border-color: #27ae60;
            background-color: #f0fff4;
        }

        .char-counter {
            font-size: 11px;
            color: #999;
            text-align: right;
            margin-top: 5px;
        }

        .char-counter.warning {
            color: #f39c12;
        }

        .char-counter.error {
            color: #e74c3c;
        }

        .option-group {
            margin-top: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option-item.selected {
            border-color: #667eea;
            background: #e8f0ff;
        }

        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option-item label {
            cursor: pointer;
            flex: 1;
            color: #333;
            font-size: 14px;
        }

        .selection-counter {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        .validation-message {
            display: block;
            font-size: 12px;
            margin-top: 8px;
            min-height: 18px;
            padding: 6px 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .validation-message.error {
            color: #e74c3c;
            background: #ffeaea;
            border-left: 3px solid #e74c3c;
        }

        .validation-message.success {
            color: #27ae60;
            background: #eafaf1;
            border-left: 3px solid #27ae60;
        }

        .validation-message.warning {
            color: #f39c12;
            background: #fef5e7;
            border-left: 3px solid #f39c12;
        }

        .submit-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
            text-align: center;
        }

        .submit-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .validation-summary {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .validation-summary.show {
            display: block;
        }

        .validation-summary h3 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .validation-summary ul {
            margin-left: 20px;
            color: #856404;
        }

        .validation-summary li {
            margin-bottom: 5px;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Dynamic Survey Builder</h1>
        
        <div class="survey-container">
            <div class="survey-header">
                <h2 class="survey-title">Customer Feedback Survey</h2>
                <p class="survey-description">Please fill out all required fields. Your feedback is valuable to us!</p>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <div class="validation-summary" id="validationSummary">
                <h3>⚠️ Please fix the following errors:</h3>
                <ul id="validationErrors"></ul>
            </div>

            <form id="surveyForm" novalidate>
                <div id="questionsContainer">
                    <!-- Questions will be dynamically generated here -->
                </div>

                <div class="submit-section">
                    <button type="submit" class="submit-btn" id="submitBtn" disabled>Submit Survey</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 'q1',
                type: 'text',
                label: 'What is your full name?',
                required: true,
                placeholder: 'Enter your full name',
                maxLength: 50,
                minLength: 2,
                validation: {
                    pattern: /^[a-zA-Z\s]+$/,
                    errorMessage: 'Name can only contain letters and spaces'
                }
            },
            {
                id: 'q2',
                type: 'text',
                label: 'What is your email address?',
                required: true,
                placeholder: 'example@email.com',
                validation: {
                    pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                    errorMessage: 'Please enter a valid email address'
                }
            },
            {
                id: 'q3',
                type: 'text',
                label: 'Tell us about your experience (optional)',
                required: false,
                placeholder: 'Share your thoughts...',
                maxLength: 500,
                minLength: 10,
                hint: 'Minimum 10 characters, maximum 500 characters'
            },
            {
                id: 'q4',
                type: 'radio',
                label: 'How satisfied are you with our service?',
                required: true,
                options: [
                    { value: 'very-satisfied', label: 'Very Satisfied' },
                    { value: 'satisfied', label: 'Satisfied' },
                    { value: 'neutral', label: 'Neutral' },
                    { value: 'dissatisfied', label: 'Dissatisfied' },
                    { value: 'very-dissatisfied', label: 'Very Dissatisfied' }
                ]
            },
            {
                id: 'q5',
                type: 'radio',
                label: 'How likely are you to recommend us to others?',
                required: true,
                options: [
                    { value: 'very-likely', label: 'Very Likely' },
                    { value: 'likely', label: 'Likely' },
                    { value: 'neutral', label: 'Neutral' },
                    { value: 'unlikely', label: 'Unlikely' },
                    { value: 'very-unlikely', label: 'Very Unlikely' }
                ]
            },
            {
                id: 'q6',
                type: 'checkbox',
                label: 'Which features did you use? (Select all that apply)',
                required: true,
                minSelections: 1,
                maxSelections: 5,
                options: [
                    { value: 'feature1', label: 'Online Ordering' },
                    { value: 'feature2', label: 'Customer Support' },
                    { value: 'feature3', label: 'Mobile App' },
                    { value: 'feature4', label: 'Loyalty Program' },
                    { value: 'feature5', label: 'Product Reviews' },
                    { value: 'feature6', label: 'Wishlist' },
                    { value: 'feature7', label: 'Quick Checkout' }
                ],
                hint: 'Select at least 1 and up to 5 options'
            },
            {
                id: 'q7',
                type: 'checkbox',
                label: 'How did you hear about us? (Select all that apply)',
                required: false,
                minSelections: 0,
                maxSelections: 3,
                options: [
                    { value: 'social-media', label: 'Social Media' },
                    { value: 'friend', label: 'Friend/Family' },
                    { value: 'advertisement', label: 'Advertisement' },
                    { value: 'search-engine', label: 'Search Engine' },
                    { value: 'other', label: 'Other' }
                ],
                hint: 'Select up to 3 options'
            },
            {
                id: 'q8',
                type: 'text',
                label: 'Any additional comments or suggestions?',
                required: false,
                placeholder: 'Your comments...',
                maxLength: 1000,
                hint: 'Maximum 1000 characters'
            }
        ];

        const validationState = {};

        // Initialize survey
        document.addEventListener('DOMContentLoaded', () => {
            generateSurveyForm();
            setupFormValidation();
            updateProgress();
        });

        function generateSurveyForm() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach(question => {
                const questionGroup = document.createElement('div');
                questionGroup.className = 'question-group';
                questionGroup.id = `group-${question.id}`;
                questionGroup.setAttribute('data-question-id', question.id);

                let questionHTML = `
                    <label class="question-label">
                        ${question.label}
                        ${question.required ? '<span class="required-mark">*</span>' : ''}
                    </label>
                `;

                if (question.hint) {
                    questionHTML += `<div class="question-hint">${question.hint}</div>`;
                }

                if (question.type === 'text') {
                    questionHTML += `
                        <input 
                            type="text" 
                            id="${question.id}" 
                            name="${question.id}"
                            class="text-input"
                            placeholder="${question.placeholder || ''}"
                            ${question.required ? 'required' : ''}
                            ${question.maxLength ? `maxlength="${question.maxLength}"` : ''}
                            ${question.minLength ? `minlength="${question.minLength}"` : ''}
                        >
                    `;
                    if (question.maxLength) {
                        questionHTML += `<div class="char-counter" id="counter-${question.id}">0 / ${question.maxLength}</div>`;
                    }
                } else if (question.type === 'radio') {
                    questionHTML += '<div class="option-group">';
                    question.options.forEach(option => {
                        questionHTML += `
                            <div class="option-item">
                                <input 
                                    type="radio" 
                                    id="${question.id}-${option.value}" 
                                    name="${question.id}" 
                                    value="${option.value}"
                                    ${question.required ? 'required' : ''}
                                >
                                <label for="${question.id}-${option.value}">${option.label}</label>
                            </div>
                        `;
                    });
                    questionHTML += '</div>';
                } else if (question.type === 'checkbox') {
                    questionHTML += '<div class="option-group">';
                    question.options.forEach(option => {
                        questionHTML += `
                            <div class="option-item">
                                <input 
                                    type="checkbox" 
                                    id="${question.id}-${option.value}" 
                                    name="${question.id}" 
                                    value="${option.value}"
                                >
                                <label for="${question.id}-${option.value}">${option.label}</label>
                            </div>
                        `;
                    });
                    questionHTML += '</div>';
                    if (question.minSelections !== undefined || question.maxSelections !== undefined) {
                        questionHTML += `<div class="selection-counter" id="selection-counter-${question.id}">0 selected</div>`;
                    }
                }

                questionHTML += `<span class="validation-message" id="validation-${question.id}"></span>`;

                questionGroup.innerHTML = questionHTML;
                container.appendChild(questionGroup);

                validationState[question.id] = !question.required;
            });

            setupFieldListeners();
        }

        function setupFieldListeners() {
            questions.forEach(question => {
                const field = document.getElementById(question.id);
                const questionGroup = document.getElementById(`group-${question.id}`);

                if (question.type === 'text') {
                    if (field) {
                        field.addEventListener('input', () => {
                            validateField(question.id);
                            if (question.maxLength) {
                                updateCharCounter(question.id);
                            }
                        });
                        field.addEventListener('blur', () => validateField(question.id));
                    }
                } else if (question.type === 'radio') {
                    question.options.forEach(option => {
                        const radioInput = document.getElementById(`${question.id}-${option.value}`);
                        if (radioInput) {
                            radioInput.addEventListener('change', () => {
                                validateField(question.id);
                                updateRadioSelection(question.id);
                            });
                        }
                    });
                } else if (question.type === 'checkbox') {
                    question.options.forEach(option => {
                        const checkboxInput = document.getElementById(`${question.id}-${option.value}`);
                        if (checkboxInput) {
                            checkboxInput.addEventListener('change', () => {
                                validateField(question.id);
                                updateCheckboxSelection(question.id);
                            });
                        }
                    });
                }
            });
        }

        function validateField(questionId) {
            const question = questions.find(q => q.id === questionId);
            if (!question) return false;

            const field = document.getElementById(questionId);
            const validationMessage = document.getElementById(`validation-${questionId}`);
            const questionGroup = document.getElementById(`group-${questionId}`);
            let isValid = true;
            let errorMessage = '';

            if (question.type === 'text') {
                const value = field ? field.value.trim() : '';
                
                if (question.required && value.length === 0) {
                    isValid = false;
                    errorMessage = 'This field is required';
                }
                else if (question.minLength && value.length > 0 && value.length < question.minLength) {
                    isValid = false;
                    errorMessage = `Minimum ${question.minLength} characters required`;
                }
                else if (question.maxLength && value.length > question.maxLength) {
                    isValid = false;
                    errorMessage = `Maximum ${question.maxLength} characters allowed`;
                }
                else if (question.validation && question.validation.pattern && value.length > 0) {
                    if (!question.validation.pattern.test(value)) {
                        isValid = false;
                        errorMessage = question.validation.errorMessage || 'Invalid format';
                    }
                }
            } else if (question.type === 'radio') {
                const selectedRadio = document.querySelector(`input[name="${questionId}"]:checked`);
                
                if (question.required && !selectedRadio) {
                    isValid = false;
                    errorMessage = 'Please select an option';
                }
            } else if (question.type === 'checkbox') {
                const checkedBoxes = document.querySelectorAll(`input[name="${questionId}"]:checked`);
                const selectionCount = checkedBoxes.length;
                
                if (question.required && selectionCount === 0) {
                    isValid = false;
                    errorMessage = 'Please select at least one option';
                } else if (question.minSelections !== undefined && selectionCount < question.minSelections) {
                    isValid = false;
                    errorMessage = `Please select at least ${question.minSelections} option(s)`;
                } else if (question.maxSelections !== undefined && selectionCount > question.maxSelections) {
                    isValid = false;
                    errorMessage = `Please select no more than ${question.maxSelections} option(s)`;
                }
            }

            if (field) {
                field.classList.remove('invalid', 'valid');
                if (field.value.length > 0 || question.type !== 'text') {
                    field.classList.add(isValid ? 'valid' : 'invalid');
                }
            }

            questionGroup.classList.remove('invalid', 'valid');
            if (isValid) {
                questionGroup.classList.add('valid');
                validationMessage.textContent = '';
                validationMessage.className = 'validation-message';
            } else {
                questionGroup.classList.add('invalid');
                validationMessage.textContent = errorMessage;
                validationMessage.className = 'validation-message error';
            }

            validationState[questionId] = isValid;
            updateSubmitButton();
            updateProgress();
            return isValid;
        }

        function updateCharCounter(questionId) {
            const field = document.getElementById(questionId);
            const counter = document.getElementById(`counter-${questionId}`);
            const question = questions.find(q => q.id === questionId);

            if (field && counter && question) {
                const length = field.value.length;
                const maxLength = question.maxLength;
                const percentage = (length / maxLength) * 100;

                counter.textContent = `${length} / ${maxLength}`;
                counter.className = 'char-counter';

                if (percentage >= 90) {
                    counter.classList.add('error');
                } else if (percentage >= 75) {
                    counter.classList.add('warning');
                }
            }
        }

        function updateRadioSelection(questionId) {
            const selectedRadio = document.querySelector(`input[name="${questionId}"]:checked`);
            const optionItems = document.querySelectorAll(`#group-${questionId} .option-item`);

            optionItems.forEach(item => {
                item.classList.remove('selected');
            });

            if (selectedRadio) {
                const optionItem = selectedRadio.closest('.option-item');
                if (optionItem) {
                    optionItem.classList.add('selected');
                }
            }
        }

        function updateCheckboxSelection(questionId) {
            const checkedBoxes = document.querySelectorAll(`input[name="${questionId}"]:checked`);
            const selectionCounter = document.getElementById(`selection-counter-${questionId}`);
            const question = questions.find(q => q.id === questionId);

            if (selectionCounter && question) {
                const count = checkedBoxes.length;
                selectionCounter.textContent = `${count} selected`;
                
                if (question.maxSelections && count >= question.maxSelections) {
                    selectionCounter.style.color = '#e74c3c';
                } else {
                    selectionCounter.style.color = '#666';
                }
            }

            const optionItems = document.querySelectorAll(`#group-${questionId} .option-item`);
            optionItems.forEach(item => {
                const checkbox = item.querySelector('input[type="checkbox"]');
                if (checkbox && checkbox.checked) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        function setupFormValidation() {
            const form = document.getElementById('surveyForm');
            form.addEventListener('submit', handleFormSubmit);
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            let allValid = true;
            const errors = [];

            questions.forEach(question => {
                const isValid = validateField(question.id);
                if (!isValid && question.required) {
                    allValid = false;
                    errors.push(`${question.label}: ${document.getElementById(`validation-${question.id}`).textContent || 'Invalid input'}`);
                }
            });

            if (!allValid) {
                showValidationSummary(errors);
                const firstInvalid = document.querySelector('.question-group.invalid');
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            const formData = collectFormData();
            console.log('Survey submitted successfully:', formData);
            alert('Survey submitted successfully! Thank you for your feedback.\n\nCheck console for form data.');
        }

        function collectFormData() {
            const data = {};
            questions.forEach(question => {
                if (question.type === 'text') {
                    const field = document.getElementById(question.id);
                    data[question.id] = field ? field.value.trim() : '';
                } else if (question.type === 'radio') {
                    const selected = document.querySelector(`input[name="${question.id}"]:checked`);
                    data[question.id] = selected ? selected.value : null;
                } else if (question.type === 'checkbox') {
                    const checked = document.querySelectorAll(`input[name="${question.id}"]:checked`);
                    data[question.id] = Array.from(checked).map(cb => cb.value);
                }
            });
            return data;
        }

        function showValidationSummary(errors) {
            const summary = document.getElementById('validationSummary');
            const errorList = document.getElementById('validationErrors');
            
            if (errors.length > 0) {
                errorList.innerHTML = '';
                errors.forEach(error => {
                    const li = document.createElement('li');
                    li.textContent = error;
                    errorList.appendChild(li);
                });
                summary.classList.add('show');
            } else {
                summary.classList.remove('show');
            }
        }

        function updateSubmitButton() {
            const submitBtn = document.getElementById('submitBtn');
            const allValid = Object.values(validationState).every(state => state === true);
            submitBtn.disabled = !allValid;
        }

        function updateProgress() {
            const totalQuestions = questions.length;
            const validQuestions = Object.values(validationState).filter(state => state === true).length;
            const percentage = (validQuestions / totalQuestions) * 100;
            
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${percentage}%`;
        }
    </script>
</body>
</html>
