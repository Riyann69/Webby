<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Shopping Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .products-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .cart-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .product-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .product-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .product-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .product-category {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .product-price {
            font-size: 20px;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .quantity-input {
            width: 60px;
            padding: 6px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-add {
            background: #27ae60;
            color: white;
        }

        .btn-add:hover {
            background: #229954;
            transform: scale(1.05);
        }

        .btn-remove {
            background: #e74c3c;
            color: white;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        .btn-update {
            background: #3498db;
            color: white;
        }

        .btn-update:hover {
            background: #2980b9;
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 10px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .cart-item-details {
            font-size: 12px;
            color: #666;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .quantity-btn.decrease {
            background: #e74c3c;
            color: white;
        }

        .quantity-btn.increase {
            background: #27ae60;
            color: white;
        }

        .quantity-btn:hover {
            transform: scale(1.1);
        }

        .cart-item-price {
            font-weight: 700;
            color: #667eea;
            font-size: 18px;
        }

        .coupon-section {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .coupon-input-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .coupon-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .coupon-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-apply {
            background: #f39c12;
            color: white;
        }

        .btn-apply:hover {
            background: #e67e22;
        }

        .coupon-message {
            margin-top: 8px;
            font-size: 12px;
            min-height: 18px;
        }

        .coupon-message.success {
            color: #27ae60;
        }

        .coupon-message.error {
            color: #e74c3c;
        }

        .price-summary {
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
            margin-top: 15px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .price-row.total {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            border-top: 2px solid #e0e0e0;
            padding-top: 10px;
            margin-top: 10px;
        }

        .discount-badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }

        .empty-cart {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .time-badge {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .cart-section {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Intelligent Shopping Cart <span id="timeBadge" class="time-badge"></span></h1>
        
        <div class="main-content">
            <!-- Products Section -->
            <div class="products-section">
                <h2>Available Products</h2>
                <div class="product-grid" id="productGrid">
                    <!-- Products will be dynamically generated -->
                </div>
            </div>

            <!-- Shopping Cart Section -->
            <div class="cart-section">
                <h2>Shopping Cart</h2>
                
                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">Your cart is empty</div>
                </div>

                <!-- Coupon Section -->
                <div class="coupon-section">
                    <h3 style="font-size: 16px; margin-bottom: 10px;">Apply Coupon Code</h3>
                    <div class="coupon-input-group">
                        <input type="text" id="couponInput" class="coupon-input" placeholder="Enter coupon code">
                        <button class="btn btn-apply" onclick="applyCoupon()">Apply</button>
                    </div>
                    <div class="coupon-message" id="couponMessage"></div>
                </div>

                <!-- Price Summary -->
                <div class="price-summary" id="priceSummary" style="display: none;">
                    <div class="price-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="price-row" id="bulkDiscountRow" style="display: none;">
                        <span>Bulk Discount:</span>
                        <span id="bulkDiscount" style="color: #27ae60;">-$0.00</span>
                    </div>
                    <div class="price-row" id="categoryDiscountRow" style="display: none;">
                        <span>Category Discount:</span>
                        <span id="categoryDiscount" style="color: #27ae60;">-$0.00</span>
                    </div>
                    <div class="price-row" id="couponDiscountRow" style="display: none;">
                        <span>Coupon Discount:</span>
                        <span id="couponDiscount" style="color: #27ae60;">-$0.00</span>
                    </div>
                    <div class="price-row" id="timeDiscountRow" style="display: none;">
                        <span>Time-Based Discount:</span>
                        <span id="timeDiscount" style="color: #27ae60;">-$0.00</span>
                    </div>
                    <div class="price-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Product array with name, price, quantity, and category
        const products = [
            { id: 1, name: 'Laptop', price: 999.99, category: 'electronics', stock: 10 },
            { id: 2, name: 'Mouse', price: 29.99, category: 'electronics', stock: 50 },
            { id: 3, name: 'Keyboard', price: 79.99, category: 'electronics', stock: 30 },
            { id: 4, name: 'T-Shirt', price: 19.99, category: 'clothing', stock: 100 },
            { id: 5, name: 'Jeans', price: 49.99, category: 'clothing', stock: 75 },
            { id: 6, name: 'Shoes', price: 89.99, category: 'clothing', stock: 60 },
            { id: 7, name: 'Book', price: 14.99, category: 'books', stock: 200 },
            { id: 8, name: 'Notebook', price: 9.99, category: 'books', stock: 150 },
            { id: 9, name: 'Pen Set', price: 12.99, category: 'books', stock: 120 },
            { id: 10, name: 'Headphones', price: 149.99, category: 'electronics', stock: 40 }
        ];

        // Shopping cart array
        let cart = [];

        // Applied coupon code
        let appliedCoupon = null;

        // Valid coupon codes with discount percentages
        const validCoupons = {
            'SAVE10': 10,
            'SAVE20': 20,
            'WELCOME15': 15,
            'SUMMER25': 25,
            'FLASH30': 30
        };

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            displayProducts();
            updateTimeBadge();
            updateCart();
            // Update time badge every minute
            setInterval(updateTimeBadge, 60000);
        });

        // Display products in the grid
        function displayProducts() {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = '';

            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-name">${product.name}</div>
                    <div class="product-category">${product.category}</div>
                    <div class="product-price">$${product.price.toFixed(2)}</div>
                    <div class="product-actions">
                        <input type="number" 
                               class="quantity-input" 
                               id="qty-${product.id}" 
                               min="1" 
                               max="${product.stock}" 
                               value="1">
                        <button class="btn btn-add" onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                `;
                productGrid.appendChild(productCard);
            });
        }

        // Add product to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const quantityInput = document.getElementById(`qty-${productId}`);
            const quantity = parseInt(quantityInput.value) || 1;

            if (quantity < 1 || quantity > product.stock) {
                alert(`Please enter a quantity between 1 and ${product.stock}`);
                return;
            }

            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                const newQuantity = existingItem.quantity + quantity;
                if (newQuantity > product.stock) {
                    alert(`Cannot add more. Only ${product.stock} items available in stock.`);
                    return;
                }
                existingItem.quantity = newQuantity;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    category: product.category,
                    quantity: quantity
                });
            }

            quantityInput.value = 1;
            updateCart();
        }

        // Remove item from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // Update item quantity in cart
        function updateCartQuantity(productId, newQuantity) {
            const item = cart.find(item => item.id === productId);
            const product = products.find(p => p.id === productId);

            if (item) {
                const quantity = parseInt(newQuantity);
                if (quantity < 1) {
                    removeFromCart(productId);
                } else if (quantity > product.stock) {
                    alert(`Only ${product.stock} items available in stock.`);
                    item.quantity = product.stock;
                } else {
                    item.quantity = quantity;
                }
                updateCart();
            }
        }

        // Update cart display
        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const priceSummary = document.getElementById('priceSummary');

            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
                priceSummary.style.display = 'none';
                return;
            }

            priceSummary.style.display = 'block';
            cartItems.innerHTML = '';

            cart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-details">${item.category} • $${item.price.toFixed(2)} each</div>
                        <div class="cart-item-quantity">
                            <button class="quantity-btn decrease" onclick="updateCartQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <input type="number" 
                                   value="${item.quantity}" 
                                   min="1" 
                                   max="${products.find(p => p.id === item.id).stock}"
                                   onchange="updateCartQuantity(${item.id}, this.value)"
                                   style="width: 50px; text-align: center; border: 1px solid #ddd; border-radius: 3px; padding: 4px;">
                            <button class="quantity-btn increase" onclick="updateCartQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                        <button class="btn btn-remove" onclick="removeFromCart(${item.id})" style="margin-top: 8px; padding: 5px 10px; font-size: 12px;">Remove</button>
                    </div>
                `;
                cartItems.appendChild(cartItem);
            });

            calculateTotal();
        }

        // Apply coupon code
        function applyCoupon() {
            const couponInput = document.getElementById('couponInput');
            const couponMessage = document.getElementById('couponMessage');
            const couponCode = couponInput.value.trim().toUpperCase();

            // Validate coupon code using string methods
            if (!couponCode) {
                couponMessage.textContent = 'Please enter a coupon code';
                couponMessage.className = 'coupon-message error';
                return;
            }

            // Check if coupon code exists (case-insensitive)
            if (validCoupons.hasOwnProperty(couponCode)) {
                appliedCoupon = couponCode;
                couponMessage.textContent = `Coupon "${couponCode}" applied! ${validCoupons[couponCode]}% discount`;
                couponMessage.className = 'coupon-message success';
                couponInput.disabled = true;
                updateCart();
            } else {
                // Check for partial matches or similar codes
                const similarCodes = Object.keys(validCoupons).filter(code => 
                    code.toLowerCase().includes(couponCode.toLowerCase()) || 
                    couponCode.toLowerCase().includes(code.toLowerCase())
                );

                if (similarCodes.length > 0) {
                    couponMessage.textContent = `Invalid code. Did you mean: ${similarCodes.join(', ')}?`;
                } else {
                    couponMessage.textContent = 'Invalid coupon code. Please try again.';
                }
                couponMessage.className = 'coupon-message error';
                appliedCoupon = null;
                updateCart();
            }
        }

        // Calculate total with all discounts
        function calculateTotal() {
            let subtotal = 0;

            // Calculate subtotal
            cart.forEach(item => {
                subtotal += item.price * item.quantity;
            });

            // Apply discounts
            const discounts = calculateDiscounts(subtotal);
            const total = subtotal - discounts.total;

            // Update UI
            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;

            // Display discount rows
            if (discounts.bulk > 0) {
                document.getElementById('bulkDiscountRow').style.display = 'flex';
                document.getElementById('bulkDiscount').textContent = `-$${discounts.bulk.toFixed(2)}`;
            } else {
                document.getElementById('bulkDiscountRow').style.display = 'none';
            }

            if (discounts.category > 0) {
                document.getElementById('categoryDiscountRow').style.display = 'flex';
                document.getElementById('categoryDiscount').textContent = `-$${discounts.category.toFixed(2)}`;
            } else {
                document.getElementById('categoryDiscountRow').style.display = 'none';
            }

            if (discounts.coupon > 0) {
                document.getElementById('couponDiscountRow').style.display = 'flex';
                document.getElementById('couponDiscount').textContent = `-$${discounts.coupon.toFixed(2)}`;
            } else {
                document.getElementById('couponDiscountRow').style.display = 'none';
            }

            if (discounts.time > 0) {
                document.getElementById('timeDiscountRow').style.display = 'flex';
                document.getElementById('timeDiscount').textContent = `-$${discounts.time.toFixed(2)}`;
            } else {
                document.getElementById('timeDiscountRow').style.display = 'none';
            }
        }

        // Calculate all discounts
        function calculateDiscounts(subtotal) {
            const discounts = {
                bulk: 0,
                category: 0,
                coupon: 0,
                time: 0,
                total: 0
            };

            // Bulk discount: 5% off if total quantity >= 10 items
            const totalQuantity = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalQuantity >= 10) {
                discounts.bulk = subtotal * 0.05;
            }

            // Category-based discount: 10% off electronics if >= 3 electronics items
            const electronicsItems = cart.filter(item => item.category === 'electronics');
            const electronicsQuantity = electronicsItems.reduce((sum, item) => sum + item.quantity, 0);
            if (electronicsQuantity >= 3) {
                const electronicsSubtotal = electronicsItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                discounts.category = electronicsSubtotal * 0.10;
            }

            // Coupon discount
            if (appliedCoupon && validCoupons[appliedCoupon]) {
                const discountPercent = validCoupons[appliedCoupon];
                discounts.coupon = subtotal * (discountPercent / 100);
            }

            // Time-based discount: 5% off during evening hours (6 PM - 9 PM)
            const currentHour = new Date().getHours();
            if (currentHour >= 18 && currentHour < 21) {
                discounts.time = subtotal * 0.05;
            }

            // Calculate total discount (apply in sequence to avoid double discounting)
            let discountedSubtotal = subtotal;
            discountedSubtotal -= discounts.bulk;
            discountedSubtotal -= discounts.category;
            discountedSubtotal -= discounts.coupon;
            discountedSubtotal -= discounts.time;

            discounts.total = subtotal - discountedSubtotal;

            return discounts;
        }

        // Update time badge
        function updateTimeBadge() {
            const timeBadge = document.getElementById('timeBadge');
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}`;

            // Check if it's discount hours
            if (hours >= 18 && hours < 21) {
                timeBadge.textContent = `⏰ Evening Sale (5% OFF) - ${timeString}`;
                timeBadge.style.background = '#e74c3c';
            } else {
                timeBadge.textContent = `Current Time: ${timeString}`;
                timeBadge.style.background = '#3498db';
            }

            // Update cart to reflect time-based discount changes
            if (cart.length > 0) {
                updateCart();
            }
        }
    </script>
</body>
</html>
